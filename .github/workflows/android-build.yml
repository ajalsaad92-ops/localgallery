name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute auto version
        id: version
        run: |
          BASE=$(node -p "require('./package.json').version.split('-')[0]")
          MAJOR_MINOR=$(echo "$BASE" | awk -F. '{print $1"."$2}')
          VERSION="${MAJOR_MINOR}.${{ github.run_number }}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building version v$VERSION"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # === توقيع ثابت للأبد ===
      # مفتاح التوقيع مثبّت داخل المستودع (signing/app-signing.keystore) فلا
      # يعتمد على كاش ولا على إعداد خارجي — نفس البصمة في كل بناء، دائماً.
      #
      # Secret اسمه ANDROID_KEYSTORE_BASE64 يُقبل فقط إذا كان صالحاً ومطابقاً
      # لـ FINGERPRINT.txt. أي Secret تالف أو قديم يُتجاهَل تلقائياً مع تحذير،
      # بدل أن يكسر البناء أو — الأسوأ — يُنتج APK بتوقيع مختلف.
      - name: Install signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p ~/.android
          EXPECTED="$(tr -d '[:space:]' < signing/FINGERPRINT.txt)"

          fingerprint_of() {
            keytool -list -v -keystore "$1" -storepass android 2>/dev/null \
              | grep 'SHA256:' | head -1 | sed 's/.*SHA256: *//' | tr -d '[:space:]'
          }

          USE_REPO_KEY=1
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "وُجد Secret باسم ANDROID_KEYSTORE_BASE64 — جارٍ التحقق منه..."
            if echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > /tmp/secret.keystore 2>/dev/null \
               && [ -s /tmp/secret.keystore ] \
               && [ "$(fingerprint_of /tmp/secret.keystore)" = "$EXPECTED" ]; then
              cp /tmp/secret.keystore ~/.android/debug.keystore
              USE_REPO_KEY=0
              echo "✅ مصدر المفتاح: Secret (صالح ومطابق للبصمة)"
            else
              echo "::warning::الـ Secret المسمّى ANDROID_KEYSTORE_BASE64 تالف أو بصمته مختلفة — تم تجاهله."
              echo "::warning::يُستحسن حذفه من: Settings ← Secrets and variables ← Actions"
            fi
            rm -f /tmp/secret.keystore
          fi

          if [ "$USE_REPO_KEY" = "1" ]; then
            cp signing/app-signing.keystore ~/.android/debug.keystore
            echo "✅ مصدر المفتاح: المستودع (signing/app-signing.keystore)"
          fi

      # فحص مبكر للمفتاح — رسالة خطأ أوضح قبل قضاء 10 دقائق في البناء.
      - name: Sanity-check keystore fingerprint
        run: |
          EXPECTED="$(tr -d '[:space:]' < signing/FINGERPRINT.txt)"
          ACTUAL="$(keytool -list -v -keystore ~/.android/debug.keystore -storepass android \
                    | grep 'SHA256:' | head -1 | sed 's/.*SHA256: *//' | tr -d '[:space:]')"
          echo "المتوقّع: $EXPECTED"
          echo "الفعلي  : $ACTUAL"
          [ "$EXPECTED" = "$ACTUAL" ] || {
            echo "::error::مفتاح التوقيع لا يطابق signing/FINGERPRINT.txt"
            exit 1
          }


      - name: Cache npm store
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json', 'package.json') }}
          restore-keys: npm-${{ runner.os }}-

      - name: Install dependencies (with retries)
        run: |
          npm config set fetch-retries 6
          npm config set fetch-retry-mintimeout 20000
          npm config set fetch-retry-maxtimeout 180000
          npm config set fetch-timeout 900000
          npm config set maxsockets 5
          npm config set registry https://registry.npmjs.org/

          for attempt in 1 2 3 4; do
            echo "::group::npm install attempt $attempt"
            if npm install --no-audit --no-fund --prefer-offline; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            echo "install failed (attempt $attempt), retrying in $((attempt * 20))s..."
            sleep $((attempt * 20))
          done
          echo "npm install failed after 4 attempts"
          exit 1

      - name: Write version into package.json
        run: npm version "${{ steps.version.outputs.version }}" --no-git-tag-version --allow-same-version

      - name: Build web bundle
        run: npm run build

      - name: Add Android platform + patch manifest
        env:
          SKIP_WEB_BUILD: "1"   # الحزمة مبنية في الخطوة السابقة — لا تبنِها مرتين
        run: node scripts/prepare-android.mjs

      - name: Grant gradlew permission
        run: chmod +x android/gradlew

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      # الحارس الحقيقي: يفحص شهادة الـ APK المبني نفسه — وهي ما يقارنه أندرويد
      # عند التحديث. فحص المفتاح وحده لا يكفي: الإصدارات ١١ و٣٠ و٤٢ و٤٩ خرجت
      # بأربع شهادات مختلفة رغم أن الوركفلو كان ينسخ مفتاحاً إلى نفس المسار.
      - name: Verify APK signing certificate
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          APKSIGNER="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          echo "apksigner: $APKSIGNER"

          norm() { tr 'A-F' 'a-f' | tr -d ': \t\r\n'; }
          EXPECTED="$(norm < signing/FINGERPRINT.txt)"
          ACTUAL="$("$APKSIGNER" verify --print-certs "$APK" \
                    | grep -i 'SHA-256 digest' | head -1 | sed 's/.*: *//' | norm)"

          echo "المتوقّع: $EXPECTED"
          echo "الفعلي  : $ACTUAL"
          if [ -z "$ACTUAL" ] || [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "::error::شهادة الـ APK لا تطابق المتوقّع — لن يُنشر."
            echo "::error::تثبيت هذا الملف كان سيفشل على كل جهاز عليه نسخة سابقة."
            exit 1
          fi
          echo "✅ شهادة الـ APK مطابقة — التحديث داخل التطبيق سيعمل."

      - name: Rename APK with version
        run: |
          mkdir -p dist-apk
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             dist-apk/localphotos-pro-v${{ steps.version.outputs.version }}.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: localphotos-pro-v${{ steps.version.outputs.version }}
          path: dist-apk/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          files: dist-apk/*.apk
          generate_release_notes: true
          make_latest: true
